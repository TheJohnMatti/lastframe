<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>lastframe demo player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 15px system-ui, sans-serif; }
  .stage { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
  .ui { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .screen { color: #9aa0aa; text-align: center; }
  .time { font-size: 44px; font-variant-numeric: tabular-nums; font-weight: 700; }
  button { font: inherit; padding: 10px 22px; border-radius: 8px; border: 1px solid #444; background: #1c1c1c; color: #eee; cursor: pointer; }
  input[type=range] { width: min(560px, 80vw); }
</style>
</head>
<body>
<div class="stage">
  <video id="v" src="sample.webm" preload="metadata" playsinline muted></video>
  <div class="ui">
    <div class="screen" id="what"></div>
    <div class="time" id="time">0:00</div>
    <input id="seek" type="range" min="0" step="1" value="0" />
    <div><button id="play">Play</button> <button id="end">Skip to end</button></div>
  </div>
</div>
<script>
  // A stand-in for a site's player, so lastframe can be tried without any real
  // source. It plays a real (blank, silent) 75-minute video, which the
  // extension can follow like any other, and also reports its time to a parent
  // page the way many embed players do.
  const q = new URLSearchParams(location.search)
  const v = document.getElementById('v')
  const seek = document.getElementById('seek')
  const label = q.get('s') ? `${q.get('id')} · S${q.get('s')} E${q.get('e')}` : q.get('id') || 'unknown title'
  document.getElementById('what').textContent = `Demo player · ${label}`
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`
  function post(event) {
    if (parent !== window) parent.postMessage({ type: 'PLAYER_EVENT', data: { event, currentTime: v.currentTime, duration: v.duration } }, '*')
  }
  function draw() {
    const d = Number.isFinite(v.duration) ? v.duration : 0
    document.getElementById('time').textContent = `${fmt(v.currentTime)} / ${fmt(d)}`
    seek.max = d
    seek.value = v.currentTime
    document.getElementById('play').textContent = v.paused ? 'Play' : 'Pause'
  }
  v.addEventListener('loadedmetadata', () => {
    const t = Number(q.get('t') || 0)
    if (t > 0) v.currentTime = t
    draw()
    post('ready')
  })
  v.addEventListener('timeupdate', () => { draw(); post('timeupdate') })
  v.addEventListener('play', () => { draw(); post('play') })
  v.addEventListener('pause', () => { draw(); post('pause') })
  v.addEventListener('ended', () => { draw(); post('ended') })
  v.addEventListener('seeked', () => { draw(); post('seeked') })
  document.getElementById('play').onclick = () => (v.paused ? v.play() : v.pause())
  document.getElementById('end').onclick = () => { v.currentTime = Math.max(0, v.duration - 20) }
  seek.oninput = () => { v.currentTime = Number(seek.value) }
</script>
</body>
</html>
